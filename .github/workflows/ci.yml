name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Python lint and formatting
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Shell syntax
        run: bash -n start.sh
      - name: JavaScript syntax
        run: |
          node --check src/pi_agenda/static/admin.js
          node --check src/pi_agenda/static/player.js
          node --check src/pi_agenda/static/startup.js
      - name: Test
        run: pytest
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
