<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Pi-Agenda{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='enhancements.css') }}">
  <script src="{{ url_for('static', filename='admin.js') }}" defer></script>
</head>
<body class="admin-body">
  <header class="topbar">
    <a class="brand" href="{{ url_for('admin.dashboard') }}">Pi-Agenda</a>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('admin.playlists') }}">Playlists</a>
      <a href="{{ url_for('admin.add_item') }}">Add content</a>
      <a href="{{ url_for('admin.schedules') }}">Schedules</a>
      <a href="{{ url_for('admin.widgets') }}">Widgets</a>
      <a href="{{ url_for('admin.settings') }}">Settings</a>
      <a href="{{ url_for('admin.system') }}">System</a>
    </nav>
    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="link-button" type="submit">Log out</button>
    </form>
  </header>
  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
